name: ci

# The gate this repository runs locally, run again where it cannot be skipped:
# formatting, the pure-V rule, the build, the prod build, the test suite, the
# links between the documents, and the workflows. `tools/README.md` says what
# each step checks.
#
# Two steps in the gate job are recorded rather than gated, because neither has
# a number a change can be held to yet: the benchmark, and the self compile.
# Both write to the run's summary, so the state is in the run rather than only
# in a terminal.
#
# Four jobs: the gate, the compliance corpus on a runner of its own, the
# regression corpus on a runner of its own, and a run against whatever V master
# is today, which is allowed to fail. The last three each build the pinned V,
# because a job is one machine and the pin is the only thing they must share;
# see the comment on each for why it is worth the build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The V this tree is built and tested with, as a commit rather than a release
  # tag on purpose: the 0.5.2 release cannot compile this tree at all. Its
  # checker rejects a `for {}` that returns from every path
  # (parser/parser.v, parse_parameters and parse_arguments), which the compiler
  # after it accepts. V moves quickly, so this is bumped deliberately, with the
  # tree re-verified against the commit it moves to.
  #
  # The floor is u128: parser/literals.v reads a long double's literal through one
  # (0cc8338), and upstream gained u128 and i128 on 2026-10-01. A pin older than
  # that fails the build with `parser/literals.v:448:15: error: unknown function:
  # u128`, and every test file fails behind it.
  #
  # The later floor is the bootstrap, and it is the one that moves. `make` in the
  # V checkout does not use the tree's own compiler: it clones vlang/vc, the
  # rolling snapshot of master's generated C, and builds v1 from that. A pin is
  # viable only while its source is one that snapshot's compiler still accepts,
  # and the snapshot follows master. The 2026-10-01 pin wrote an `if` condition
  # as `if (if x > 0.0 { x } else { -x }) < smallest_normal`; afbe25ce
  # (2026-10-05) made that a checker error, so the v1 built from the snapshot
  # refused the pinned source at vlib/math/bits/bits.v:621 and every job died at
  # "build V at the pinned commit" without this tree changing at all. This pin is
  # the master commit the current snapshot (vlang/vc 98961dd) was generated from,
  # so the two agree by construction. Expect to move it when the snapshot does,
  # and move it in all four places that name it: the three workflows and the
  # Dockerfile.
  V_COMMIT: a6826c4db0e28d306160fcc9e96baca90ea78f40
  V_DIR: /opt/v

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    # The self compile step below builds this tree a second time, so the job now
    # carries that cost on top of the gate's.
    timeout-minutes: 30
    # The tests badge in README.md reads a number this job computes, so this job
    # needs to write. Everything else in the workflow is read-only, and a pull
    # request from a fork gets a read-only token whatever this says, which is why
    # the step that writes is guarded to a push on main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: build V at the pinned commit
        run: |
          git clone --quiet https://github.com/vlang/v "$V_DIR"
          git -C "$V_DIR" checkout --quiet "$V_COMMIT"
          make -C "$V_DIR"
          echo "$V_DIR" >> "$GITHUB_PATH"
          "$V_DIR/v" version

      - name: gate
        run: |
          v version
          v run tools/gate.vsh

      # The self-compile: this tree built by this tree, which is the first link
      # of the bootstrap chain. `v . -o vcc1` builds the compiler with V, and
      # `v . -cc vcc1 -o vcc` asks V for the same C again and hands it to the
      # compiler it just built, so vcc has to read and emit the C V writes for
      # it, 110,838 lines of it today.
      #
      # Recorded, not gated, for the same reason the benchmark is: vcc cannot do
      # it yet, and a red job would say only that something is wrong. The first
      # refusal is `src.c:6166:135: unsupported: * takes int operands, and this
      # one is a pointer`, and that is a parser bug rather than a missing back
      # end: a declarator written after one whose initializer holds a cast is
      # given the cast's type, so `unsigned long lb` reads as `unsigned int` and
      # the product it appears in is refused. When the second command exits 0
      # and the binary it wrote runs, this is a gate and `continue-on-error`
      # comes off.
      - name: self compile (recorded, not gated)
        continue-on-error: true
        run: |
          work="$(mktemp -d)"
          {
            echo '### self compile'
            echo '```'
            if ! v . -o "$work/vcc1"; then
              echo 'this tree did not build with V'
            elif v . -cc "$work/vcc1" -o "$work/vcc" > "$work/log" 2>&1; then
              echo 'the compiler read and emitted the C V writes for it'
              "$work/vcc" --version
            else
              echo 'this tree cannot read the C V writes for it yet'
              # The attempt is mostly V's notices about other people's source,
              # each three lines of quoted context. The refusal is what matters,
              # so the context lines are dropped and the rest is kept.
              grep -vE '^ *[0-9]+ \||^ *\|' "$work/log" | tail -20
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The tests badge in README.md reads a number this job computes, from the
      # tool that counts the suite rather than a second glob that can drift from
      # it. A push made with GITHUB_TOKEN does not start another workflow run, so
      # this cannot loop.
      - name: keep the tests badge current
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          count=$(v run tools/tests.vsh --count)
          file=.github/badges/tests.json
          printf '{"tests": %s}\n' "$count" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then
            echo "the badge already reads ${count} tests"
            exit 0
          fi
          git commit --quiet -m "docs: the badge reads ${count} tests"
          # The remote can move while this job runs: another push, or one of the
          # other badge jobs finishing first. The two commands share a line so a
          # rejected rebase cannot push a stale badge as though it were current.
          # `origin main` is named rather than a bare pull because a detached
          # HEAD has no branch to merge into, and HEAD:main rather than a bare
          # push because checkout can leave a detached HEAD on some events.
          git pull --rebase --quiet origin main && git push origin HEAD:main

      # The lines badge in README.md reads this, from the tool the count has one
      # home in. It is a walk over the tracked files, so it costs nothing beside
      # the gate, and it carries its own commit for the same reason the ones
      # above do.
      - name: keep the lines badge current
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          count=$(v run tools/lines.vsh --count)
          file=.github/badges/lines.json
          printf '{"lines": %s}\n' "$count" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then
            echo "the badge already reads ${count} lines"
            exit 0
          fi
          git commit --quiet -m "docs: the badge reads ${count} lines"
          # The remote can move while this job runs: another push, or one of the
          # other badge jobs finishing first. The two commands share a line so a
          # rejected rebase cannot push a stale badge as though it were current.
          # `origin main` is named rather than a bare pull because a detached
          # HEAD has no branch to merge into, and HEAD:main rather than a bare
          # push because checkout can leave a detached HEAD on some events.
          git pull --rebase --quiet origin main && git push origin HEAD:main

      # The numbers are recorded, not gated. A shared runner's wall time is not
      # a budget anyone can hold a pull request to, and the workload that will
      # decide this project is the V self-build, which no milestone reaches yet
      # (ROADMAP M6). Until then the point is that the harness runs and the
      # number is written down somewhere other than a terminal.
      - name: benchmark
        continue-on-error: true
        run: |
          {
            echo '### benchmark on this runner'
            echo '```'
            v run tools/bench.vsh --terms 20000 --runs 3 2>&1 || echo 'the harness could not run'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The one check that measures this compiler against a C library rather than
  # against its own tests: the corpus under compliance/ is one small test per
  # answer, in a directory per C standard, and each one is compiled and run on
  # its own under the standard of the directory it sits in. It has a runner to
  # itself because its cost is a thousand compiles rather than one test suite,
  # and because a corpus that fails and a gate that fails are two different
  # answers to two different questions. The price is a second build of the same
  # pinned V; the pin itself is in one place, above.
  compliance:
    name: compliance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The badge in README.md reads a number this job computes, so this job needs
    # to write. Everything else in the workflow is read-only, and a pull request
    # from a fork gets a read-only token whatever this says, which is why the step
    # that writes is guarded to a push on main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: build V at the pinned commit
        run: |
          git clone --quiet https://github.com/vlang/v "$V_DIR"
          git -C "$V_DIR" checkout --quiet "$V_COMMIT"
          make -C "$V_DIR"
          echo "$V_DIR" >> "$GITHUB_PATH"
          "$V_DIR/v" version

      # The script builds the compiler from this tree itself, so the only thing
      # this job has to get right is which `v` is on PATH.
      - name: compliance corpus
        run: v run tools/compliance.vsh

      # The one thing a run can write back: the number of tests in the corpus,
      # read by the badge in README.md. It comes from the runner's own file
      # collection rather than from a second glob, so the badge cannot disagree
      # with what actually runs. A push made with GITHUB_TOKEN does not start
      # another workflow run, so this cannot loop.
      - name: keep the badge count current
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          count=$(v run tools/compliance.vsh --count)
          file=.github/badges/compliance-tests.json
          printf '{"tests": %s}\n' "$count" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then
            echo "the badge already reads ${count} tests"
            exit 0
          fi
          git commit --quiet -m "docs: the badge reads ${count} compliance tests"
          # The remote can move while this job runs: another push, or one of the
          # other badge jobs finishing first. The two commands share a line so a
          # rejected rebase cannot push a stale badge as though it were current.
          # `origin main` is named rather than a bare pull because a detached
          # HEAD has no branch to merge into, and HEAD:main rather than a bare
          # push because checkout can leave a detached HEAD on some events.
          git pull --rebase --quiet origin main && git push origin HEAD:main

  # The regression corpus: one C program per bug this compiler has already put
  # right, and one golden program per answer whose exact stdout must not move.
  # Each case is compiled and run on its own. It has a runner to itself for the
  # same reason the compliance corpus does: its cost is a compile and a run per
  # case rather than one test suite, and a corpus that regresses and a gate that
  # fails are two different answers to two different questions. The price is a
  # third build of the same pinned V; the pin itself is in one place, above.
  regressions:
    name: regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The badge in README.md reads a number this job computes, so this job needs
    # to write. Everything else in the workflow is read-only, and a pull request
    # from a fork gets a read-only token whatever this says, which is why the step
    # that writes is guarded to a push on main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: build V at the pinned commit
        run: |
          git clone --quiet https://github.com/vlang/v "$V_DIR"
          git -C "$V_DIR" checkout --quiet "$V_COMMIT"
          make -C "$V_DIR"
          echo "$V_DIR" >> "$GITHUB_PATH"
          "$V_DIR/v" version

      # The script builds the compiler from this tree itself, so the only thing
      # this job has to get right is which `v` is on PATH. The run's summary is
      # kept in a file because the badge step below reads its failure count.
      - name: regression corpus
        run: |
          set -o pipefail
          v run tools/regress.vsh 2>&1 | tee "$RUNNER_TEMP/regress.log"

      # The two numbers the regressions badge in README.md carries: the case
      # count, read from the runner's own file collection rather than from a
      # second glob, and the number of cases the run just failed, read from its
      # summary line. The badge counts failing cases (regression/README.md), so
      # this step runs even when the corpus above failed; the job is still red,
      # and the badge records the failure instead of the run hiding it. A push
      # made with GITHUB_TOKEN does not start another workflow run, so this
      # cannot loop.
      - name: keep the regressions badge current
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          count=$(v run tools/regress.vsh --count)
          failed=$(grep -oE '[0-9]+ failed' "$RUNNER_TEMP/regress.log" 2>/dev/null | grep -oE '[0-9]+' | head -1)
          file=.github/badges/regressions.json
          printf '{"tests": %s, "failed": %s}\n' "$count" "${failed:-0}" > "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if git diff --cached --quiet; then
            echo "the badge already reads ${count} cases, ${failed:-0} failing"
            exit 0
          fi
          git commit --quiet -m "docs: the badge reads ${count} cases, ${failed:-0} failing"
          # The remote can move while this job runs: another push, or one of the
          # other badge jobs finishing first. The two commands share a line so a
          # rejected rebase cannot push a stale badge as though it were current.
          # `origin main` is named rather than a bare pull because a detached
          # HEAD has no branch to merge into, and HEAD:main rather than a bare
          # push because checkout can leave a detached HEAD on some events.
          git pull --rebase --quiet origin main && git push origin HEAD:main

  master:
    name: newer V (allowed to fail)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # V master is not the version this tree promises to build with. Running it
    # anyway is how the next bump is noticed before it is a surprise rather than
    # after it is an outage.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: build V master
        run: |
          git clone --quiet --depth 1 https://github.com/vlang/v "$V_DIR"
          make -C "$V_DIR"
          echo "$V_DIR" >> "$GITHUB_PATH"
          # $GITHUB_PATH reaches the steps after this one, not this one, so the
          # binary built here is named by its path and the next step gets `v`.
          "$V_DIR/v" version

      - name: build and test
        run: |
          v -o vcc .
          v test .
